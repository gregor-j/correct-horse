name: PHP CI

on:
  push:
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  composer:
    name: Composer config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate composer configuration
        run: composer validate --strict

  php:
    name: PHP ${{ matrix.php-version }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: [ '7.2', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4' ]
        dependencies: [ default ]
        include:
          - php-version: '7.2'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Install Composer dependencies (default)
        if: matrix.dependencies == 'default'
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Install Composer dependencies (lowest)
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-dist --no-interaction --no-progress
      - name: Audit Composer dependencies
        if: matrix.php-version == '7.2'
        run: composer audit
      - name: Check PHP syntax
        run: find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run PHPCS
        run: php vendor/bin/phpcs
      - name: Run PHPUnit
        run: php vendor/bin/phpunit
