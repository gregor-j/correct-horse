name: "CI pipeline"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: "read"

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:

  composer:
    name: "Composer config validation"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - name: "Validate composer.json"
        run: "composer validate --strict"

  php:
    name: "PHP ${{ matrix.php-version }} (${{ matrix.dependencies }})"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        dependencies:
          - "default"
        include:
          - php-version: "8.1"
            dependencies: "lowest"
          - php-version: "8.5"
            dependencies: "lowest"
    steps:
      - name: "git checkout"
        uses: "actions/checkout@v7"
        with:
          persist-credentials: false
      - name: "Install, check and audit the same dependency snapshot"
        env:
          LOWEST: "${{ matrix.dependencies == 'lowest' && '1' || '0' }}"
        run: "make check PHP_VERSION=${{ matrix.php-version }} DEPENDENCIES_LOWEST=$LOWEST"
